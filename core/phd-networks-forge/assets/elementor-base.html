<div class="forge-[component-id]">
  <!-- Component HTML goes here -->

<script>
(function() {
  'use strict';

  // ============================================
  // FORGE COMPONENT INITIALIZATION
  // Self-executing, no global pollution
  // ============================================

  // Check for required dependencies
  if (typeof gsap === 'undefined') {
    console.warn('FORGE: GSAP not loaded. Add to page header.');
    return;
  }

  // Register plugins if available
  if (typeof ScrollTrigger !== 'undefined') {
    gsap.registerPlugin(ScrollTrigger);
  }

  // Component reference
  const component = document.querySelector('.forge-[component-id]');
  if (!component) return;

  // ============================================
  // COMPONENT LOGIC
  // ============================================

  // Animations
  gsap.from(component, {
    scrollTrigger: {
      trigger: component,
      start: 'top 80%',
      toggleActions: 'play none none reverse'
    },
    y: 60,
    opacity: 0,
    duration: 1,
    ease: 'power3.out'
  });

  // ============================================
  // MAGNETIC BUTTONS (if present)
  // ============================================

  const magneticBtns = component.querySelectorAll('.magnetic-btn');
  const magneticStrength = 0.25; // Professional mode

  magneticBtns.forEach(btn => {
    btn.addEventListener('mousemove', (e) => {
      const rect = btn.getBoundingClientRect();
      const x = e.clientX - rect.left - rect.width / 2;
      const y = e.clientY - rect.top - rect.height / 2;

      gsap.to(btn, {
        x: x * magneticStrength,
        y: y * magneticStrength,
        duration: 0.3,
        ease: 'power2.out'
      });
    });

    btn.addEventListener('mouseleave', () => {
      gsap.to(btn, {
        x: 0,
        y: 0,
        duration: 0.5,
        ease: 'elastic.out(1, 0.5)'
      });
    });
  });

})();
</script>

<!-- END FORGE COMPONENT -->
